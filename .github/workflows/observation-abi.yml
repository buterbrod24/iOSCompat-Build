name: Observation independent SDK import audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'observation-abi/**'
      - '.github/workflows/observation-abi.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile stock client and compare against isolated candidate exports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abi-source" output
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios17.0 -sdk "$sdk" -swift-version 5 -parse-as-library -module-name StockObservationClient -Onone -emit-object observation-abi/Stock.swift -o "$RUNNER_TEMP/stock.o"
          xcrun nm -ju "$RUNNER_TEMP/stock.o" > "$RUNNER_TEMP/stock-imports.txt"
          root="https://raw.githubusercontent.com/swiftlang/swift/ea95594ae137f288bf29a0b489b8689680a0086a"
          for file in Observable.swift ObservationRegistrar.swift ObservationTracking.swift; do
            curl -fsSL "$root/stdlib/public/Observation/Sources/Observation/$file" -o "$RUNNER_TEMP/abi-source/$file"
          done
          python3 - <<'PY'
          import os,pathlib
          for p in (pathlib.Path(os.environ["RUNNER_TEMP"])/"abi-source").glob("*.swift"):
              s=p.read_text()
              if "@available(SwiftStdlib 5.9, *)" not in s: raise SystemExit("unexpected source")
              s=s.replace("@available(SwiftStdlib 5.9, *)","@available(iOS 16.2, *)")
              if p.name=="Observable.swift": s=s.split("#if $Macros && hasAttribute(attached)",1)[0]
              p.write_text(s)
          PY
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -enable-library-evolution -module-name Observation -emit-library -Onone "$RUNNER_TEMP/abi-source/"*.swift observation-research/PlatformSupport.swift -Xlinker -install_name -Xlinker @rpath/libObservationResearch.dylib -o "$RUNNER_TEMP/candidate.dylib"
          xcrun nm -gjU "$RUNNER_TEMP/candidate.dylib" > "$RUNNER_TEMP/candidate-exports.txt"
          python3 observation-abi/compare.py "$RUNNER_TEMP/stock-imports.txt" "$RUNNER_TEMP/candidate-exports.txt" | tee output/stock-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-sdk-audit
          path: output/*.txt
          if-no-files-found: warn
