name: Observation experimental physical device probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observation-device-experimental.yml'
      - 'observation-research/**'
      - 'observation-host/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated host module and test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-source" output
          root="https://raw.githubusercontent.com/swiftlang/swift/ea95594ae137f288bf29a0b489b8689680a0086a"
          for file in Observable.swift ObservationRegistrar.swift ObservationTracking.swift; do
            curl -fsSL "$root/stdlib/public/Observation/Sources/Observation/$file" -o "$RUNNER_TEMP/host-source/$file"
          done
          python3 - <<'PY'
          import os,pathlib
          for p in (pathlib.Path(os.environ["RUNNER_TEMP"])/"host-source").glob("*.swift"):
              s=p.read_text()
              if "@available(SwiftStdlib 5.9, *)" not in s: raise SystemExit("unexpected source")
              s=s.replace("@available(SwiftStdlib 5.9, *)","@available(macOS 13.0, *)")
              if p.name=="Observable.swift": s=s.split("#if $Macros && hasAttribute(attached)",1)[0]
              p.write_text(s)
          PY
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx swiftc -target "$(uname -m)-apple-macos13.0" -sdk "$sdk" -swift-version 5 -parse-as-library -module-name ObservationHostControl -Onone "$RUNNER_TEMP/host-source/"*.swift observation-research/PlatformSupport.swift observation-research/Checks.swift observation-host/HostControls.swift -o "$RUNNER_TEMP/host-tests"
          xcrun otool -L "$RUNNER_TEMP/host-tests" | tee output/host-dependencies.txt
          if grep -F 'libswiftObservation.dylib' output/host-dependencies.txt; then exit 1; fi
          "$RUNNER_TEMP/host-tests" | tee output/host-results.txt
          grep -Fx 'TOTAL 12/12' output/host-results.txt
      - name: Fetch pinned open-source Swift 5.9 and compile isolated candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observation" output
          root="https://raw.githubusercontent.com/swiftlang/swift/ea95594ae137f288bf29a0b489b8689680a0086a"
          for file in Observable.swift ObservationRegistrar.swift ObservationTracking.swift; do
            curl --fail --silent --show-error --location "$root/stdlib/public/Observation/Sources/Observation/$file" -o "$RUNNER_TEMP/observation/$file"
          done
          curl --fail --silent --show-error --location "$root/LICENSE.txt" -o "$RUNNER_TEMP/observation/LICENSE.txt"
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"observation"
          for p in root.glob("*.swift"):
              s=p.read_text()
              if "@available(SwiftStdlib 5.9, *)" not in s: raise SystemExit("unexpected upstream source")
              s=s.replace("@available(SwiftStdlib 5.9, *)","@available(iOS 16.2, *)")
              if p.name=="Observable.swift":
                  s=s.split("#if $Macros && hasAttribute(attached)",1)[0]
              p.write_text(s)
          PY
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          lib="$RUNNER_TEMP/observation/libObservationResearch.dylib"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -enable-library-evolution -module-name Observation -emit-library -Onone "$RUNNER_TEMP/observation/"*.swift observation-research/PlatformSupport.swift observation-research/Checks.swift observation-research/DeviceBridge.swift -Xlinker -install_name -Xlinker @rpath/libObservationResearch.dylib -o "$lib"
          xcrun vtool -show-build "$lib" | tee output/build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/build.txt
          xcrun nm -gjU "$lib" > "$RUNNER_TEMP/exports.txt"
          python3 - <<'PY' | tee output/export-check.txt
          import os,pathlib
          exports=set((pathlib.Path(os.environ["RUNNER_TEMP"])/"exports.txt").read_text().splitlines())
          expected=pathlib.Path("observation-research/required-exports.txt").read_text().splitlines()
          missing=set(expected)-exports
          for name in expected: print("ABSENT" if name in missing else "PRESENT",name)
          print("TOTAL",len(expected)-len(missing),"/",len(expected))
          if missing: raise SystemExit(1)
          PY
          xcrun nm -um "$lib" > output/imports.txt
          xcrun otool -L "$lib" > output/dependencies.txt
          if grep -F '/usr/lib/swift/libswiftObservation.dylib' output/dependencies.txt; then exit 1; fi
      - name: Package experimental device probe after native host controls
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          app="$PWD/build/observation/Payload/ObservationDeviceProbe.app"
          mkdir -p "$app/Frameworks" output-device
          cp "$RUNNER_TEMP/observation/libObservationResearch.dylib" "$app/Frameworks/"
          cp "$RUNNER_TEMP/observation/LICENSE.txt" "$app/Observation-LICENSE.txt"
          cp observation-research/NOTICE.txt "$app/Observation-NOTICE.txt"
          cp unified/Info.plist "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable ObservationDeviceProbe' -c 'Set :CFBundleIdentifier net.ioscompat.observationprobe' -c 'Set :CFBundleName ObservationDeviceProbe' -c 'Set :CFBundleDisplayName Observation Probe' -c 'Set :CFBundleShortVersionString 0.1.0' -c 'Set :CFBundleVersion 1' "$app/Info.plist"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library observation-research/DeviceProbe.swift -o "$app/ObservationDeviceProbe"
          xcrun vtool -show-build "$app/ObservationDeviceProbe" | grep -Eq 'minos[[:space:]]+16\.2$'
          xcrun otool -L "$app/ObservationDeviceProbe" > output/device-dependencies.txt
          if grep -F 'libswiftObservation.dylib' output/device-dependencies.txt; then exit 1; fi
          codesign --force --sign - "$app/Frameworks/libObservationResearch.dylib"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          (cd build/observation && zip -qry "$GITHUB_WORKSPACE/output-device/iOSCompat-ObservationProbe-0.1.0-EXPERIMENTAL.ipa" Payload)
          unzip -t output-device/iOSCompat-ObservationProbe-0.1.0-EXPERIMENTAL.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: observation-device-experimental
          path: output-device/iOSCompat-ObservationProbe-0.1.0-EXPERIMENTAL.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-experimental-evidence
          path: output/*.txt
          if-no-files-found: warn
