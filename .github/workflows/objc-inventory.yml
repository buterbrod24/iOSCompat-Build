name: Objective-C runtime API inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'objc-inventory/**'
      - '.github/workflows/objc-inventory.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build original iOS 16.2 probe
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          app="$PWD/build/objc/Payload/ObjCProbe.app"
          mkdir -p "$app" output
          cp unified/Info.plist "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable ObjCProbe' -c 'Set :CFBundleIdentifier net.ioscompat.objcprobe' -c 'Set :CFBundleName ObjCProbe' -c 'Set :CFBundleDisplayName Objective-C Probe' -c 'Set :CFBundleShortVersionString 0.1.0' -c 'Set :CFBundleVersion 1' "$app/Info.plist"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -O objc-inventory/Inventory.swift objc-inventory/DeviceProbe.swift -o "$app/ObjCProbe"
          xcrun vtool -show-build "$app/ObjCProbe" | tee output/build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/build.txt
          xcrun nm -um "$app/ObjCProbe" > output/imports.txt
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          (cd build/objc && zip -qry "$GITHUB_WORKSPACE/output/iOSCompat-ObjCProbe-0.1.0.ipa" Payload)
          unzip -t output/iOSCompat-ObjCProbe-0.1.0.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: objc-device-probe
          path: output/iOSCompat-ObjCProbe-0.1.0.ipa
          if-no-files-found: error
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect modern simulator metadata comparison
        run: |
          set -euo pipefail
          mkdir -p output
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY' > "$RUNNER_TEMP/objc-device.txt"
          import json,os,re,pathlib
          choices=[]
          for runtime,items in json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"devices.json").read_text())["devices"].items():
              m=re.search(r"\.iOS-(\d+)-(\d+)",runtime)
              if not m or int(m.group(1))<17: continue
              for item in items:
                  if item.get("isAvailable") and item["name"].startswith("iPhone"): choices.append((int(m.group(1)),int(m.group(2)),item["udid"]))
          if not choices: raise SystemExit("No iOS 17+ simulator")
          print(max(choices)[2])
          PY
          device="$(cat "$RUNNER_TEMP/objc-device.txt")"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -target "$(uname -m)-apple-ios17.0-simulator" -sdk "$sdk" -swift-version 5 -parse-as-library objc-inventory/Inventory.swift objc-inventory/Measure.swift -o "$RUNNER_TEMP/objc-measure"
          xcrun simctl spawn "$device" "$RUNNER_TEMP/objc-measure" | tee output/simulator.txt
          grep -Fx 'PASS baseline inventory' output/simulator.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objc-simulator-evidence
          path: output/*.txt
          if-no-files-found: warn
      - name: Shutdown simulator
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/objc-device.txt"; then xcrun simctl shutdown "$(cat "$RUNNER_TEMP/objc-device.txt")" || true; fi
