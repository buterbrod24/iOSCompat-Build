name: Visual effect and explicit scroll geometry research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'visual-research/**'
      - '.github/workflows/visual-research.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p output
          xcrun swiftc -swift-version 5 -parse-as-library -O visual-research/Effect.swift visual-research/Measure.swift -o "$RUNNER_TEMP/measure"
          "$RUNNER_TEMP/measure" | tee output/controls.txt
          grep -Fx 'TOTAL 14/14' output/controls.txt
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -O visual-research/Effect.swift visual-research/Adapter.swift visual-research/Measure.swift -o "$RUNNER_TEMP/measure-ios"
          xcrun vtool -show-build "$RUNNER_TEMP/measure-ios" | tee output/build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/build.txt
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -emit-library -enable-library-evolution -module-name CompatVisualResearch visual-research/Effect.swift visual-research/Adapter.swift -o "$RUNNER_TEMP/libCompatVisualResearch.dylib"
          xcrun nm -ju "$RUNNER_TEMP/libCompatVisualResearch.dylib" > output/legacy-imports.txt
          if grep -E 'EmptyVisualEffect|ScrollTransitionPhase|12VisualEffectP' output/legacy-imports.txt; then exit 1; fi
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios17.0 -sdk "$sdk" -swift-version 5 -parse-as-library -Onone -emit-object visual-research/Stock.swift -o "$RUNNER_TEMP/stock.o"
          xcrun nm -ju "$RUNNER_TEMP/stock.o" > output/stock-imports.txt
          xcrun swift-demangle --compact < output/stock-imports.txt > output/stock-demangled.txt
          grep -F 'VisualEffect' output/stock-demangled.txt
          grep -F 'scrollTransition' output/stock-demangled.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-research-evidence
          path: output/*.txt
          if-no-files-found: warn
