name: Unified iOS 16.2 device diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified/**'
      - 'array-compat/MutationCandidate.swift'
      - 'metadata-compat/ContextFixture.swift'
      - 'metadata-compat/WitnessFixture.swift'
      - 'opaque-research/Fixture.swift'
      - 'metadata-compat/Candidate.swift'
      - 'metadata-compat/MangledLookup.swift'
      - 'executor-research/Checks.swift'
      - 'activity-protocol/Candidate.swift'
      - '.github/workflows/unified-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  unified:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned callable and stock bundles; build unified runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          input="$RUNNER_TEMP/callable"
          app="$PWD/build/unified/Payload/UnifiedProbe.app"
          out="$PWD/output-unified"
          mkdir -p "$input" "$app/Frameworks" "$out"
          gh run download 45885387172 --repo "$GITHUB_REPOSITORY" --name appintents-callable-device-probe --dir "$input"
          unzip -t "$input/iOSCompat-AppIntents-Callable-0.2.0.ipa"
          unzip -q "$input/iOSCompat-AppIntents-Callable-0.2.0.ipa" -d "$input/extracted"
          for lib in libAppIntentsCompat.dylib libAppIntentsStockClient.dylib; do
            cp "$input/extracted/Payload/AppIntentsCallableProbe.app/Frameworks/$lib" "$app/Frameworks/"
            codesign --verify --strict "$app/Frameworks/$lib"
          done
          mkdir -p "$RUNNER_TEMP/stock-batch"
          gh run download 45889657494 --repo "$GITHUB_REPOSITORY" --name unified-stock-client-batch --dir "$RUNNER_TEMP/stock-batch"
          for lib in libConcurrencyCompat.dylib libConcurrencyStockClient.dylib libSwiftUIStockClient.dylib; do
            cp "$RUNNER_TEMP/stock-batch/$lib" "$app/Frameworks/"
            codesign --verify --strict "$app/Frameworks/$lib"
          done
          mkdir -p "$RUNNER_TEMP/array-compat" "$RUNNER_TEMP/toolbar-pair"
          gh run download 45892050055 --repo "$GITHUB_REPOSITORY" --name swiftcore-reserve-candidate --dir "$RUNNER_TEMP/array-compat"
          gh run download 45893067193 --repo "$GITHUB_REPOSITORY" --name swiftui-toolbar-pair-candidate --dir "$RUNNER_TEMP/toolbar-pair"
          for lib in libSwiftCoreCompat.dylib libSwiftCoreStockClient.dylib; do
            cp "$RUNNER_TEMP/array-compat/$lib" "$app/Frameworks/"
            codesign --verify --strict "$app/Frameworks/$lib"
          done
          for lib in libSwiftUICompat.dylib libSwiftUIToolbarPairStockClient.dylib; do
            cp "$RUNNER_TEMP/toolbar-pair/$lib" "$app/Frameworks/"
            codesign --verify --strict "$app/Frameworks/$lib"
          done
          modules="$RUNNER_TEMP/unified-modules"
          mkdir -p "$modules"
          for module in WitnessFixture OpaqueFixture; do
            if [ "$module" = WitnessFixture ]; then src=metadata-compat/WitnessFixture.swift; else src=opaque-research/Fixture.swift; fi
            lib="$app/Frameworks/lib$module.dylib"
            xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -O -parse-as-library -enable-library-evolution -module-name "$module" -emit-library -emit-module -emit-module-path "$modules/$module.swiftmodule" "$src" -Xlinker -install_name -Xlinker "@rpath/lib$module.dylib" -o "$lib"
            codesign --force --sign - "$lib"
          done
          lib="$app/Frameworks/libSwiftCoreMutationCompat.dylib"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -O -parse-as-library -module-name SwiftCoreMutationCompat -emit-library -emit-module -emit-module-path "$modules/SwiftCoreMutationCompat.swiftmodule" array-compat/MutationCandidate.swift -Xlinker -install_name -Xlinker @rpath/libSwiftCoreMutationCompat.dylib -o "$lib"
          codesign --force --sign - "$lib"
          test "$(find "$app/Frameworks" -name '*.dylib' | wc -l | tr -d ' ')" = 12
          for lib in "$app"/Frameworks/*.dylib; do
            xcrun vtool -show-build "$lib" | grep -Eq 'minos[[:space:]]+16\.2$'
          done
          cp unified/Info.plist "$app/Info.plist"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -O unified/Loader.swift unified/Suites.swift unified/Measure.swift research/LegacyChange.swift probe-v3-prep/ReserveProbe.swift activity-protocol/Candidate.swift executor-research/Checks.swift metadata-compat/Candidate.swift metadata-compat/MangledLookup.swift unified/RegistryChecks.swift unified/MangledChecks.swift unified/UnifiedWitnessChecks.swift unified/UnifiedOpaqueChecks.swift unified/UnifiedMutationChecks.swift unified/UnifiedContextChecks.swift metadata-compat/ContextFixture.swift -I "$modules" -L "$app/Frameworks" -lWitnessFixture -lOpaqueFixture -lSwiftCoreMutationCompat -Xlinker -rpath -Xlinker @executable_path/Frameworks -o "$app/UnifiedProbe"
          xcrun vtool -show-build "$app/UnifiedProbe" | tee "$out/build.txt"
          grep -Eq 'minos[[:space:]]+16\.2$' "$out/build.txt"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          (cd build/unified && zip -qry "$out/iOSCompat-UnifiedProbe-0.7.0.ipa" Payload)
          unzip -t "$out/iOSCompat-UnifiedProbe-0.7.0.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-device-probe
          path: output-unified/iOSCompat-UnifiedProbe-0.7.0.ipa
          if-no-files-found: error
