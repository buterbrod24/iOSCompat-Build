name: SwiftUI transition ABI research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'transition-research/**'
      - '.github/workflows/transition-research.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare stock and independent legacy compiler imports
        run: |
          set -euo pipefail
          mkdir -p output
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          for mode in Stock Adapter; do
            target=arm64-apple-ios16.2
            if test "$mode" = Stock; then target=arm64-apple-ios17.0; fi
            xcrun --sdk iphoneos swiftc -target "$target" -sdk "$sdk" -swift-version 5 -parse-as-library -enable-library-evolution -module-name "Transition$mode" -Onone -emit-object "transition-research/$mode.swift" -o "$RUNNER_TEMP/$mode.o"
            xcrun --sdk iphoneos swiftc -target "$target" -sdk "$sdk" -swift-version 5 -parse-as-library -enable-library-evolution -module-name "Transition$mode" -Onone -emit-ir "transition-research/$mode.swift" -o "$RUNNER_TEMP/$mode.ll"
            xcrun nm -ju "$RUNNER_TEMP/$mode.o" > "output/$mode.imports.txt"
            xcrun vtool -show-build "$RUNNER_TEMP/$mode.o" > "output/$mode.build.txt"
            xcrun swift-demangle --compact < "output/$mode.imports.txt" > "output/$mode.demangled.txt"
            grep -E 'swiftcc.*(Transition|combined|animation)' "$RUNNER_TEMP/$mode.ll" > "output/$mode.call-shapes.txt" || true
          done
          python3 transition-research/verify.py output
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -O transition-research/Adapter.swift transition-research/Measure.swift -o "$RUNNER_TEMP/measure-ios"
          xcrun vtool -show-build "$RUNNER_TEMP/measure-ios" | tee output/measure-build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/measure-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-abi-evidence
          path: output/*.txt
          if-no-files-found: warn
  controls:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute legacy transition construction controls
        run: |
          set -euo pipefail
          mkdir -p output
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY' > "$RUNNER_TEMP/transition-device.txt"
          import json,os,pathlib,re
          choices=[]
          for runtime,items in json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"devices.json").read_text())["devices"].items():
              m=re.search(r"\.iOS-(\d+)-(\d+)",runtime)
              if not m or int(m.group(1))<17: continue
              for item in items:
                  if item.get("isAvailable") and item["name"].startswith("iPhone"): choices.append((int(m.group(1)),int(m.group(2)),item["udid"]))
          if not choices: raise SystemExit("No iOS 17+ simulator")
          print(max(choices)[2])
          PY
          device="$(cat "$RUNNER_TEMP/transition-device.txt")"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -target "$(uname -m)-apple-ios16.2-simulator" -sdk "$sdk" -swift-version 5 -parse-as-library transition-research/Adapter.swift transition-research/Measure.swift -o "$RUNNER_TEMP/measure-sim"
          xcrun simctl spawn "$device" "$RUNNER_TEMP/measure-sim" | tee output/results.txt
          grep -Fx 'TOTAL CONSTRUCTED 8/8' output/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-controls
          path: output/*.txt
          if-no-files-found: warn
      - name: Shutdown simulator
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/transition-device.txt"; then xcrun simctl shutdown "$(cat "$RUNNER_TEMP/transition-device.txt")" || true; fi
