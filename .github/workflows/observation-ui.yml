name: Observation legacy reactive bridge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'observation-ui/**'
      - 'observation-research/PlatformSupport.swift'
      - '.github/workflows/observation-ui.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream runtime sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obs-ui" output
          root="https://raw.githubusercontent.com/swiftlang/swift/ea95594ae137f288bf29a0b489b8689680a0086a"
          for file in Observable.swift ObservationRegistrar.swift ObservationTracking.swift; do
            curl -fsSL "$root/stdlib/public/Observation/Sources/Observation/$file" -o "$RUNNER_TEMP/obs-ui/$file"
          done
      - name: Build and execute host controls
        run: |
          set -euo pipefail
          for platform in macOS iOS; do
            mkdir -p "$RUNNER_TEMP/obs-ui-$platform"
          done
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for p in (root/"obs-ui").glob("*.swift"):
              s=p.read_text()
              if "@available(SwiftStdlib 5.9, *)" not in s: raise SystemExit("unexpected source")
              if p.name=="Observable.swift": s=s.split("#if $Macros && hasAttribute(attached)",1)[0]
              for platform,version in (("macOS","13.0"),("iOS","16.2")):
                  (root/("obs-ui-"+platform)/p.name).write_text(s.replace("@available(SwiftStdlib 5.9, *)",f"@available({platform} {version}, *)"))
          PY
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx swiftc -target "$(uname -m)-apple-macos13.0" -sdk "$sdk" -swift-version 5 -parse-as-library -module-name ObservationUIResearch -Onone "$RUNNER_TEMP/obs-ui-macOS/"*.swift observation-research/PlatformSupport.swift observation-ui/Bridge.swift observation-ui/Measure.swift -o "$RUNNER_TEMP/observation-ui"
          xcrun otool -L "$RUNNER_TEMP/observation-ui" | tee output/host-dependencies.txt
          if grep -F 'libswiftObservation.dylib' output/host-dependencies.txt; then exit 1; fi
          "$RUNNER_TEMP/observation-ui" | tee output/host-results.txt
          grep -Fx 'TOTAL 9/9' output/host-results.txt
      - name: Build iOS 16.2 ARM64 source-level bridge
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -module-name ObservationUIResearch -Onone "$RUNNER_TEMP/obs-ui-iOS/"*.swift observation-research/PlatformSupport.swift observation-ui/Bridge.swift observation-ui/Measure.swift -o "$RUNNER_TEMP/observation-ui-ios"
          xcrun vtool -show-build "$RUNNER_TEMP/observation-ui-ios" | tee output/ios-build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/ios-build.txt
          xcrun otool -L "$RUNNER_TEMP/observation-ui-ios" | tee output/ios-dependencies.txt
          if grep -F 'libswiftObservation.dylib' output/ios-dependencies.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-ui-evidence
          path: output/*.txt
          if-no-files-found: warn
