name: SwiftUI phase sequence and completion research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'phase-research/**'
      - '.github/workflows/phase-research.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p output
          xcrun swiftc -swift-version 5 -parse-as-library -O phase-research/Sequence.swift phase-research/Measure.swift -o "$RUNNER_TEMP/phase"
          "$RUNNER_TEMP/phase" | tee output/controls.txt
          grep -Fx 'TOTAL 15/15' output/controls.txt
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library -O phase-research/Sequence.swift phase-research/Measure.swift -o "$RUNNER_TEMP/phase-ios"
          xcrun vtool -show-build "$RUNNER_TEMP/phase-ios" | tee output/build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/build.txt
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios17.0 -sdk "$sdk" -swift-version 5 -parse-as-library -Onone -emit-object phase-research/Stock.swift -o "$RUNNER_TEMP/stock.o"
          xcrun nm -ju "$RUNNER_TEMP/stock.o" > output/stock-imports.txt
          xcrun swift-demangle --compact < output/stock-imports.txt > output/stock-demangled.txt
          grep -F 'PhaseAnimator' output/stock-demangled.txt
          grep -F 'addAnimationCompletion' output/stock-demangled.txt
          grep -F 'withAnimation' output/stock-demangled.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-sequence-evidence
          path: output/*.txt
          if-no-files-found: warn
