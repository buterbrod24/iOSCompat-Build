name: Native serial executor controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'executor-research/**'
      - '.github/workflows/executor-research.yml'
permissions:
  contents: read
jobs:
  device-build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile with iOS 16.2 deployment target
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p output
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.2 -sdk "$sdk" -swift-version 5 -parse-as-library executor-research/Measure.swift -o "$RUNNER_TEMP/executor-control"
          xcrun vtool -show-build "$RUNNER_TEMP/executor-control" | tee output/build.txt
          grep -Eq 'minos[[:space:]]+16\.2$' output/build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: executor-build-evidence
          path: output/build.txt
          if-no-files-found: error
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run serial executor controls
        run: |
          set -euo pipefail
          mkdir -p output
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY' > "$RUNNER_TEMP/device.txt"
          import json,os,pathlib,re
          choices=[]
          for runtime,items in json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"devices.json").read_text())["devices"].items():
              m=re.search(r"\.iOS-(\d+)-(\d+)",runtime)
              if not m or int(m.group(1))<17: continue
              for item in items:
                  if item.get("isAvailable") and item["name"].startswith("iPhone"): choices.append((int(m.group(1)),int(m.group(2)),item["udid"]))
          if not choices: raise SystemExit("No iOS 17+ simulator")
          print(max(choices)[2])
          PY
          device="$(cat "$RUNNER_TEMP/device.txt")"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -target "$(uname -m)-apple-ios16.2-simulator" -sdk "$sdk" -swift-version 5 -parse-as-library executor-research/Measure.swift -o "$RUNNER_TEMP/executor-tests"
          xcrun simctl spawn "$device" "$RUNNER_TEMP/executor-tests" | tee output/results.txt
          grep -Fx 'TOTAL 4/4' output/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executor-simulator-results
          path: output/results.txt
          if-no-files-found: warn
      - name: Shutdown simulator
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/device.txt"; then xcrun simctl shutdown "$(cat "$RUNNER_TEMP/device.txt")" || true; fi
