          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -target "$(uname -m)-apple-ios17.0-simulator" -sdk "$sdk" -swift-version 5 -parse-as-library toolbar-v2/ToolbarCandidate.swift toolbar-v2/Measure.swift -o "$RUNNER_TEMP/measure-toolbar"
          xcrun simctl spawn "$device" "$RUNNER_TEMP/measure-toolbar" | tee output-toolbar-v2-sim/results.txt
          grep -Fx 'PASS candidate and native toolbar construction/layout' output-toolbar-v2-sim/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftui-toolbar-pair-simulator
          path: output-toolbar-v2-sim/
          if-no-files-found: warn
      - name: Shutdown simulator
        if: always()
        run: |
          if test -s output-toolbar-v2-sim/device.txt; then xcrun simctl shutdown "$(cat output-toolbar-v2-sim/device.txt)" || true; fi
\t' read -r entry target; do
            xcrun nm -gjU "$lib" | grep -Fx "$target"
          done < output-toolbar-v2/aliases.tsv
