name: Read-only IPA analyzer tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_ipa.py'
      - 'scripts/compat_catalog.json'
      - 'scripts/macho_imports.py'
      - 'scripts/test_analyze_ipa.py'
      - 'scripts/import_summary.py'
      - 'scripts/test_import_summary.py'
      - 'scripts/report_to_inventory.py'
      - 'scripts/test_report_to_inventory.py'
      - 'component-manifests/**'
      - 'scripts/verify_observation.py'
      - 'scripts/test_verify_observation.py'
      - 'scripts/backdeploy_markers.py'
      - 'scripts/test_backdeploy_markers.py'
      - 'scripts/deployment_metadata.py'
      - 'scripts/test_deployment_metadata.py'
      - 'scripts/export_trie.py'
      - 'scripts/test_export_trie.py'
      - 'scripts/reexport_graph.py'
      - 'scripts/test_reexport_graph.py'
      - 'scripts/cache_inventory.py'
      - 'scripts/test_cache_inventory.py'
      - 'scripts/cache_set.py'
      - 'scripts/test_cache_set.py'
      - 'scripts/cache_exports.py'
      - 'scripts/test_cache_exports.py'
      - 'scripts/cache_compare.py'
      - 'scripts/test_cache_compare.py'
      - 'scripts/audit_impact.py'
      - 'scripts/test_audit_impact.py'
      - 'scripts/swift_protocol_inventory.py'
      - 'scripts/test_swift_protocol_inventory.py'
      - 'scripts/swift_descriptor_inventory.py'
      - 'scripts/test_swift_descriptor_inventory.py'
      - 'scripts/swift_typeref_inventory.py'
      - 'scripts/test_swift_typeref_inventory.py'
      - 'scripts/audit_coverage.py'
      - 'scripts/test_audit_coverage.py'
      - 'scripts/legacy_bind.py'
      - 'scripts/test_legacy_bind.py'
      - '.github/workflows/analyzer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_analyze_ipa.py
      - run: python3 scripts/test_import_summary.py
      - run: python3 scripts/test_report_to_inventory.py

      - run: python3 scripts/test_verify_observation.py

      - run: python3 scripts/test_backdeploy_markers.py

      - run: python3 scripts/test_deployment_metadata.py

      - run: python3 scripts/test_export_trie.py

      - run: python3 scripts/test_reexport_graph.py

      - run: python3 scripts/test_cache_inventory.py

      - run: python3 scripts/test_cache_set.py

      - run: python3 scripts/test_cache_exports.py

      - run: python3 scripts/test_cache_compare.py

      - run: python3 scripts/test_legacy_bind.py

      - run: python3 scripts/test_audit_coverage.py

      - run: python3 scripts/test_audit_impact.py
      - run: python3 scripts/test_swift_typeref_inventory.py

      - run: python3 scripts/test_swift_descriptor_inventory.py

      - run: python3 scripts/test_swift_protocol_inventory.py
