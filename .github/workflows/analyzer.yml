name: Read-only IPA analyzer tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_ipa.py'
      - 'scripts/compat_catalog.json'
      - 'scripts/macho_imports.py'
      - 'scripts/test_analyze_ipa.py'
      - 'scripts/import_summary.py'
      - 'scripts/test_import_summary.py'
      - 'scripts/report_to_inventory.py'
      - 'scripts/test_report_to_inventory.py'
      - 'component-manifests/**'
      - 'scripts/verify_observation.py'
      - 'scripts/test_verify_observation.py'
      - 'scripts/backdeploy_markers.py'
      - 'scripts/test_backdeploy_markers.py'
      - 'scripts/deployment_metadata.py'
      - 'scripts/test_deployment_metadata.py'
      - '.github/workflows/analyzer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_analyze_ipa.py
      - run: python3 scripts/test_import_summary.py
      - run: python3 scripts/test_report_to_inventory.py

      - run: python3 scripts/test_verify_observation.py

      - run: python3 scripts/test_backdeploy_markers.py

      - run: python3 scripts/test_deployment_metadata.py
